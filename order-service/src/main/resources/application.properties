spring.application.name=order-service
server.port=8081

# Kết nối MySQL (cổng 3307 đã báo ở docker-compose)
spring.datasource.url=jdbc:mysql://localhost:3307/order_service
spring.datasource.username=root
spring.datasource.password=mysql

#update: Spring tự tạo bảng trong MySQL từ class Order, bạn không phải viết lệnh SQL
spring.jpa.hibernate.ddl-auto=update

#địa chỉ Inventory Service
inventory.url=http://localhost:8082

# Địa chỉ Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Mở địa chỉ /actuator/prometheus để Prometheus lấy số liệu
management.endpoints.web.exposure.include=health,prometheus

# Gắn tên service vào mọi số liệu (Grafana dùng để lọc)
management.metrics.tags.application=${spring.application.name}