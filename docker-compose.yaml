services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: order_service
    volumes:
      - ./data/mysql-order:/var/lib/mysql   # dữ liệu lưu ở thư mục data/ (đã nằm trong .gitignore)