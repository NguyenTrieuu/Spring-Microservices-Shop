services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: order_service
    volumes:
      - ./data/mysql-order:/var/lib/mysql   # dữ liệu lưu ở thư mục data/ (đã nằm trong .gitignore)

  mysql-inventory:
      image: mysql:8.0
      container_name: mysql-inventory
      ports:
        - "3308:3306"        # cổng 3308 trên máy bạn (3307 đã dùng cho mysql-order)
      environment:
        MYSQL_ROOT_PASSWORD: mysql
        MYSQL_DATABASE: inventory_service
      volumes:
        - ./data/mysql-inventory:/var/lib/mysql

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"        # cổng để các service Spring kết nối vào Kafka
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"   # giới hạn RAM cho Kafka

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: start-dev           # chế độ chạy để học và phát triển
    ports:
      - "8180:8080"              # mở Keycloak ở http://localhost:8180
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx512m"   # giới hạn RAM
    volumes:
      - keycloak_data:/opt/keycloak/data       # lưu dữ liệu để tắt bật không mất

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml

  mailpit:
      image: axllent/mailpit
      container_name: mailpit
      ports:
        - "8025:8025"     # giao diện web xem thư
        - "1025:1025"     # cổng nhận thư (SMTP)
volumes:
  keycloak_data:
  grafana_data: