spring.application.name=inventory-service
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3308/inventory_service
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update

# Mở địa chỉ /actuator/prometheus để Prometheus lấy số liệu
management.endpoints.web.exposure.include=health,prometheus
# Gắn tên service vào mọi số liệu (Grafana dùng để lọc)
management.metrics.tags.application=${spring.application.name}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=inventory-service
# latest: chỉ nhận tin nhắn MỚI, bỏ qua các tin cũ (định dạng cũ) đã gửi từ trước
spring.kafka.consumer.auto-offset-reset=latest