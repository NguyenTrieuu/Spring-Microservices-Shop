<div class="min-h-screen bg-gray-100">

  <header class="bg-blue-600 text-white shadow">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <h1 class="text-2xl font-bold">{{ title }}</h1>
      <div class="flex items-center gap-3">
        <span class="text-sm">Xin chào, {{ username }}</span>
        <button
          (click)="logout()"
          class="rounded bg-white px-3 py-1 text-sm font-semibold text-blue-600 hover:bg-gray-100">
          Đăng xuất
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <h2 class="mb-4 text-xl font-semibold text-gray-800">Danh sách sản phẩm</h2>

    <!-- [MỚI] @if: chỉ hiện khối này khi có lỗi -->
    @if (error()) {
      <p class="mb-4 rounded bg-red-100 p-3 text-red-700">{{ error() }}</p>
    }

    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (product of products(); track product.id) {
        <div class="rounded-lg bg-white p-4 shadow">
          <h3 class="text-lg font-semibold text-gray-900">{{ product.name }}</h3>
          <p class="mt-1 text-sm text-gray-600">{{ product.description }}</p>
          <p class="mt-3 text-lg font-bold text-blue-600">Giá: {{ product.price }}</p>
        </div>
      } @empty {
        <p class="text-gray-500">Chưa có sản phẩm nào.</p>
      }
    </div>
  </main>

</div>
