spring.application.name=product-service
server.port=8084
spring.mongodb.uri=mongodb://localhost:27017/product-service
# Mở địa chỉ /actuator/prometheus để Prometheus lấy số liệu
management.endpoints.web.exposure.include=health,prometheus
# Gắn tên service vào mọi số liệu (Grafana dùng để lọc)
management.metrics.tags.application=${spring.application.name}